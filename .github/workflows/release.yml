name: "Package and release the gem and the crates"
on:
  # Manually trigger a dry-run that doesn't publish to RubyGems or crates.io
  workflow_dispatch:
  # Trigger release flow through pushing tags
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+.beta[0-9]*

permissions:
  contents: read

jobs:
  verify_version:
    timeout-minutes: 5
    name: "Verify release versions"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Rust"
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Check versions are in sync
        run: |
          bundle exec rake sync_versions
          changes=$(git status --porcelain lib/rubydex/version.rb rust/rubydex-sys/Cargo.toml)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Versions are out of sync. Run \`bundle exec rake sync_versions\` and commit the result."
            exit 1
          fi
      - name: "Verify the tag matches the declared version"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared="$(ruby -r./lib/rubydex/version -e 'print Rubydex::VERSION')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the declared version ${declared}" >&2
            exit 1
          fi
      - name: "Verify the crates can be packaged"
        run: cargo package --workspace --manifest-path rust/Cargo.toml
  compile:
    timeout-minutes: 20
    needs: verify_version
    name: "Cross compile the gem on different ruby versions"
    strategy:
      matrix:
        os: ["macos-latest", "macos-26-intel", "ubuntu-22.04", "ubuntu-22.04-arm", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    env:
      RELEASE: "true"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Rust"
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.2.9"
          bundler-cache: true
      - name: "Update RubyGems"
        run: gem update --system 4.1.0.beta2 --prerelease
      - name: "Install cargo-about"
        run: cargo install cargo-about --features cli
      - name: "Run cibuildgem"
        uses: "ralder/cibuildgem/.github/actions/cibuildgem@dedc84caacfd77097fa2f414319b3bc85dd7b624"
        with:
          step: "compile"
          version: "0.4.1"
          include-single-abi: true
  test:
    timeout-minutes: 20
    name: "Run the test suite"
    needs: compile
    strategy:
      matrix:
        os: ["macos-latest", "macos-26-intel", "ubuntu-22.04", "ubuntu-22.04-arm", "windows-latest"]
        rubies: ["3.2", "3.3", "3.4", "4.0"]
        type: ["cross", "native"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Rust"
        run: |
          rustup update --no-self-update stable
          rustup default stable
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "${{ matrix.rubies }}"
          bundler-cache: true
      - name: "Update RubyGems"
        if: matrix.type == 'cross'
        run: gem update --system 4.1.0.beta2 --prerelease
      - name: "Run cibuildgem"
        uses: "ralder/cibuildgem/.github/actions/cibuildgem@dedc84caacfd77097fa2f414319b3bc85dd7b624"
        with:
          step: "test_${{ matrix.type }}"
          version: "0.4.1"
          include-single-abi: true
  install:
    timeout-minutes: 10
    name: "Verify the gem can be installed"
    needs: test
    strategy:
      matrix:
        os: ["macos-latest", "macos-26-intel", "ubuntu-22.04", "ubuntu-22.04-arm", "windows-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0.0"
      - name: "Run cibuildgem"
        uses: "ralder/cibuildgem/.github/actions/cibuildgem@dedc84caacfd77097fa2f414319b3bc85dd7b624"
        with:
          step: "install"
          version: "0.4.1"
  compile_musl:
    timeout-minutes: 40
    needs: verify_version
    name: "Package RubyDEX for musl (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: rust:1.100.0-alpine3.23
    env:
      RELEASE: "true"
      RUSTFLAGS: "-C target-feature=-crt-static"
    steps:
      - name: "Install build tools"
        run: apk add --no-cache bash build-base clang21-dev crane gdbm-dev git gmp-dev libffi-dev linux-headers openssl-dev readline-dev yaml-dev zlib-dev
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Install Alpine Rubies and configure Rake Compiler"
        run: bash .github/scripts/setup-musl-toolchains.sh linux/${{ matrix.arch }}
      - name: "Install dependencies"
        run: |
          gem update --system 4.1.0.beta2 --prerelease
          bundle install
          cargo install cargo-about --features cli --locked
      - name: "Package musl gems"
        uses: "ralder/cibuildgem/.github/actions/cibuildgem@dedc84caacfd77097fa2f414319b3bc85dd7b624"
        with:
          step: "compile"
          version: "0.4.1"
          include-single-abi: true
          setup-rake-compiler: "false"
          artifact-name: "stage-linux-musl-${{ matrix.arch }}"
  install_musl:
    timeout-minutes: 10
    needs: compile_musl
    name: "Install the musl gem on Alpine (Ruby ${{ matrix.ruby }}, ${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        include:
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    container: ruby:${{ matrix.ruby }}-alpine3.23
    steps:
      - name: "Install Bash for the cibuildgem action"
        run: apk add --no-cache bash
      - name: "Install the precompiled gem"
        uses: "ralder/cibuildgem/.github/actions/cibuildgem@dedc84caacfd77097fa2f414319b3bc85dd7b624"
        with:
          step: "install"
          version: "0.4.1"
          artifact-name: "stage-linux-musl-${{ matrix.arch }}"
      - name: "Load and use the musl extension"
        run: |
          ruby -rrubydex -e '
            platform = Gem.loaded_specs.fetch("rubydex").platform.to_s
            abort "Expected a musl package, got #{platform}" unless platform.end_with?("-linux-musl")
            Rubydex::Graph.new
          '
  release:
    environment: release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: "Release all gems with RubyGems"
    needs: [install, install_musl]
    runs-on: "ubuntu-latest"
    steps:
      - name: "Setup Ruby"
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "4.0"
      - name: "Update RubyGems"
        run: gem update --system 4.1.0.beta2 --prerelease
      - name: "Run cibuildgem"
        uses: "ralder/cibuildgem/.github/actions/cibuildgem@dedc84caacfd77097fa2f414319b3bc85dd7b624"
        with:
          step: "release"
          version: "0.4.1"
  release_crates:
    environment: release
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: "Release all crates with crates.io"
    needs: release
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
      - name: "Setup Rust"
        run: |
          rustup update --no-self-update stable
          rustup default stable
      # The trusted publisher must match this repository, workflow, and environment
      # for both crates.
      - name: "Exchange the Actions identity token for a crates.io token"
        id: "crates_io_auth"
        uses: "rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9" # v1.0.6
      - name: "Publish the crates"
        run: cargo publish --workspace --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.crates_io_auth.outputs.token }}"
  release_github:
    permissions:
      contents: write
    name: Create GitHub release
    needs: release_crates
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ github.ref }}",
              name: "${{ github.ref_name }}",
              generate_release_notes: true,
              prerelease: "${{ github.ref_name }}".includes(".beta")
            });
